{{ define "main" }}
  <p class="text-muted text-sm mb-6"><a class="link-accent" href="{{ "/" | relURL }}">← Home</a></p>
  <h1 class="text-2xl font-light mb-6">Projects</h1>
  <ul class="space-y-4">
    {{ range .Pages.ByWeight }}
      <li>
        <a class="link-accent font-semibold hover:opacity-80" href="{{ .RelPermalink }}">{{ .Title }}</a>
        <p class="text-sm text-muted mt-1">{{ .Params.summary }}</p>
      </li>
    {{ end }}
  </ul>
  {{ partial "footer.html" . }}
{{ end }}
