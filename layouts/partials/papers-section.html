<section class="mt-12">
  <div class="section-label">Works / Papers</div>
  <div class="mt-4 surface-card p-4 sm:p-6">
    <div class="work-list text-sm">
      {{ range sort .Site.Data.papers.items "year" "desc" }}
        <div class="work-row">
          <div class="font-semibold work-name">
            {{ if .link }}
              <a class="link-accent hover:opacity-80" href="{{ .link }}">{{ .title }}</a>
            {{ else }}
              {{ .title }}
            {{ end }}
          </div>
          <div class="text-muted work-description">{{ .venue }}</div>
          <div class="text-muted-fg work-year">{{ .year }}</div>
        </div>
      {{ end }}
    </div>
  </div>
</section>
