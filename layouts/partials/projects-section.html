<section class="mt-12">
  <div class="section-label">Projects</div>
  <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
    {{ range (where .Site.RegularPages "Section" "projects").ByWeight }}
      <a href="{{ .RelPermalink }}" class="flex flex-col sm:flex-row gap-4 items-start hover:opacity-80 transition surface-card p-4">
        <div class="w-full sm:w-1/3 shrink-0">
          {{ $thumb := .Params.image }}
          {{ range first 1 (.Resources.Match "assets/*") }}
            {{ $thumb = .RelPermalink }}
          {{ end }}
          <img src="{{ $thumb }}" alt="{{ .Title }}" class="w-full aspect-[4/3] object-cover rounded-md border border-theme" />
        </div>
        <div class="w-full sm:w-2/3">
          <div class="text-sm font-semibold">{{ .Title | upper }}</div>
          <div class="mt-2 text-sm text-muted">{{ .Params.summary }}</div>
        </div>
      </a>
    {{ end }}
  </div>
</section>
