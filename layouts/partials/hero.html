<section class="relative w-full">
  <div class="min-h-[40vh] md:min-h-[60vh] bg-cover bg-center rounded-lg overflow-hidden hero-banner" style="background-image: url('https://placehold.co/1600x900/1a1a1a/48a4ce?text=Banner');">
    <div class="h-full w-full flex items-center" style="background: var(--hero-overlay);">
      <div class="w-full px-4 sm:px-8 py-12 md:py-20 text-white">
        <h1 class="text-4xl sm:text-5xl md:text-7xl font-light">{{ .Site.Title }}</h1>
        <p class="mt-4 text-base md:text-lg hero-tagline">{{ .Site.Params.tagline }}</p>
      </div>
    </div>
  </div>

  <div class="mt-10 flex flex-col md:flex-row gap-8 items-start">
    <div class="w-full md:w-2/3 space-y-4 text-sm leading-relaxed">
      <p class="text-muted">{{ .Site.Params.description }}</p>
      <p class="text-muted">
        PhD research in autonomous vehicles, cooperative perception, and multi-agent systems at
        <a class="link-accent" href="https://computerscience.engineering.unt.edu/">UNT CSE</a>.
      </p>
      <p>
        <a class="link-accent" href="{{ .Site.Params.github }}">GitHub</a>
        ·
        <a class="link-accent" href="{{ .Site.Params.linkedin }}">LinkedIn</a>
        ·
        <a class="link-accent" href="{{ .Site.Params.cv | relURL }}">CV</a>
      </p>
    </div>

    <div class="w-full md:w-1/3">
      <img
        class="h-auto w-full object-cover rounded-lg border border-theme"
        src="{{ .Site.Params.headshot }}"
        alt="Profile portrait"
      />
      <div class="mt-4 text-xs leading-5 text-muted">
        <a class="link-accent hover:opacity-80" href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a><br />
        <a class="link-accent hover:opacity-80" href="mailto:{{ .Site.Params.schoolEmail }}">{{ .Site.Params.schoolEmail }}</a>
      </div>
    </div>
  </div>
</section>
