<section class="mt-10">
  <div class="section-label">Background / News</div>
  <div class="mt-4 surface-card p-4 sm:p-6">
    <div class="space-y-3 text-sm">
      {{ range .Site.Data.work.visible }}
        <div class="work-row">
          <div class="font-semibold">{{ .name }}</div>
          <div class="text-muted">{{ .description }}</div>
          <div class="text-muted-fg">{{ .year }}</div>
        </div>
      {{ end }}

      <div id="expandedWorks" class="hidden space-y-3">
        {{ range .Site.Data.work.hidden }}
          <div class="work-row">
            <div class="font-semibold">{{ .name }}</div>
            <div class="text-muted">{{ .description }}</div>
            <div class="text-muted-fg">{{ .year }}</div>
          </div>
        {{ end }}
      </div>

      <button
        type="button"
        onclick="var el=document.getElementById('expandedWorks'); el.classList.toggle('hidden'); this.textContent=el.classList.contains('hidden')?'Expand ▼':'Collapse ▲';"
        class="pt-2 link-accent font-semibold"
      >
        Expand ▼
      </button>
    </div>
  </div>
</section>
