<header class="flex flex-wrap items-center justify-between gap-4 text-sm font-semibold mb-8 md:mb-12">
  <a href="{{ "/" | relURL }}" class="text-base font-semibold link-accent hover:opacity-80">{{ .Site.Title }}</a>
  <div class="flex flex-wrap items-center gap-4 sm:gap-6">
    <nav class="flex flex-wrap items-center gap-4 sm:gap-6 text-sm">
      {{ range .Site.Menus.main }}
        <a class="link-accent hover:opacity-80" href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
      {{ with .Site.Params.github }}
        <a class="link-accent hover:opacity-80" href="{{ . }}">GitHub</a>
      {{ end }}
      {{ with .Site.Params.linkedin }}
        <a class="link-accent hover:opacity-80" href="{{ . }}">LinkedIn</a>
      {{ end }}
    </nav>
    <button type="button" id="theme-toggle" class="btn-theme" aria-label="Switch color theme">Dark</button>
  </div>
</header>
